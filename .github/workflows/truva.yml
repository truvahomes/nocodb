name: "nocodb.truva.in"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose what to run"
        required: true
        type: choice
        options:
          - build
          - deploy
          - build+deploy
        default: build+deploy
      tag:
        description: "Docker image tag"
        required: true

jobs:
  build-image:
    if: inputs.action == 'build' || inputs.action == 'build+deploy'
    runs-on: ubuntu-22.04
    env:
      working-directory: ./packages/nocodb
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Checkout truva branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          ref: truva

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Build GUI and SDK
        run: |
          pnpm bootstrap
          cd packages/nc-gui
          pnpm run generate
          mkdir -p ../nocodb/docker/nc-gui/
          rsync -rvzh ./dist/ ../nocodb/docker/nc-gui/

      - name: Build NocoDB
        run: |
          cd packages/nocodb
          pnpm install --ignore-scripts --no-frozen-lockfile
          pnpm run docker:build
          pnpm uninstall --save-prod nocodb-sdk

      - name: Update version in package.json
        run: |
          cd packages/nocodb
          jq --arg VERSION "$VERSION" '.version = $VERSION' package.json > tmp.json
          mv tmp.json package.json
        env:
          VERSION: ${{ inputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push the image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.REPO_NAME }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          cd packages/nocodb
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-on-ecs:
    if: inputs.action == 'deploy' || inputs.action == 'build+deploy'
    runs-on: ubuntu-22.04
    needs: [build-image]  # Runs after build if build+deploy is chosen
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Download ECS Task Definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ secrets.ECS_TASK_DEFINITION }} \
          --query taskDefinition > base-task-definition.json

      - name: Sanitize Task Definition File
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
          base-task-definition.json > pre-image-task-definition.json

      - name: Update Task Definition with New Image
        run: |
          jq '.containerDefinitions[0].image = "${{ steps.login-ecr.outputs.registry }}/${{ secrets.REPO_NAME }}:${{ inputs.tag }}"' \
          pre-image-task-definition.json > deploy-task-definition.json

      - name: Register New Task Definition
        id: register-task
        run: |
          aws ecs register-task-definition --cli-input-json file://deploy-task-definition.json | \
          jq -r '.taskDefinition.taskDefinitionArn'

      - name: Update ECS Service
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
          --service ${{ secrets.ECS_SERVICE_NAME }} \
          --task-definition ${{ secrets.ECS_TASK_DEFINITION }} \
          --enable-execute-command \
          --force-new-deployment \
          --desired-count ${{ secrets.ECS_DESIRED_COUNT }}
